[project]
name = "bugarcade-backend"
version = "0.1.0"
description = "Bounded debugging challenge orchestration"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn==0.39.0",
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "av==19.0.2",
]

[project.optional-dependencies]
cloud = ["modal==1.6.3"]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
